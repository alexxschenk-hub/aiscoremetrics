name: Preise aktualisieren

on:
  schedule:
    - cron: "17 4 * * *"   # täglich 04:17 UTC (06:17 Wiener Sommerzeit)
  workflow_dispatch:        # manuell auslösbar unter Actions → "Preise aktualisieren" → Run workflow

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preise holen
        run: node scripts/update-prices.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PRICE_REGION: germany

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/data/prices.json data/history.csv
          if git diff --cached --quiet; then
            echo "Keine Preisänderung."
          else
            git commit -m "Preise $(date -u +%Y-%m-%d)"
            git push
          fi
